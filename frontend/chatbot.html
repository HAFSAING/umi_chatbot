<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="chatbot.css">
    <title>UmiBot</title>

</head>
<body>
    <div class="chatbot-widget">

        <button class="chatbot-toggle" onclick="toggleChat()" id="chatToggle">
            💬
        </button>
        
        <div class="chatbot-container" id="chatbotContainer">
            <div class="chatbot-header">
            <div class="logo-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f7/Logo-umi.png" alt="UMI Logo" id="logoImage" onerror="showLogoFallback()">
                <div class="logo-fallback" id="logoFallback">UMI</div>
            </div>
            
                <div class="header-buttons">
                    <button class="header-btn clear-btn" onclick="showClearConfirmation()" title="Supprimer la conversation">🗑️</button>
                    <button class="header-btn" onclick="minimizeChat()" title="Minimiser">−</button>
                    <button class="header-btn" onclick="closeChat()" title="Fermer">×</button>
                </div>
            </div>
            
            <div class="chatbot-messages" id="chatMessages">
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
            
            <div class="input-container">
                <div class="file-preview-section" id="filePreviewSection"></div>
                
                <div class="chatbot-input">
                    <div class="input-group">
                        <input type="text" id="chatInput" placeholder="Type your message...">
                        <button class="voice-btn" onclick="toggleVoiceRecording()" id="voiceBtn" title="Voice input">🎤</button>
                        <button class="image-upload-btn" onclick="document.getElementById('fileInput').click()" id="fileUploadBtn" title="Upload files">
                            📂
                            <div class="file-counter" id="fileCounter">0</div>
                        </button>
                        <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.txt" multiple style="display: none;" onchange="handleFileUpload(event)">
                        <button class="send-btn" onclick="sendMessage()" id="sendBtn">➥</button>
                    </div>
                </div>
            </div>
        

            <div class="footer">
                    <button class="footer-btn" onclick="openChatbot()" title="chatbot">
                        <span class="footer-btn-icon">UMI</span>
                    </button>
                    <button class="footer-btn" onclick="openEmailForm()" title="Email">
                        <span class="footer-btn-icon">✉︎</span>
                    </button>
                    <button class="footer-btn" onclick="openWhatsApp()" title="WhatsApp">
                        <span class="footer-btn-icon">✆</span>
                    </button>
                    <button class="footer-btn" onclick="openlanguage()" title="language">
                        <span class="footer-btn-icon">🗣</span>
                    </button>
            </div>
            
        </div>


        <div class="confirmation-modal" id="clearModal">
            <div class="modal-content">
                <h3>Supprimer la conversation ?</h3>
                <p>Cette action supprimera définitivement tous les messages de la conversation actuelle. Cette action est irréversible.</p>
                <div class="modal-buttons">
                    <button class="modal-btn cancel" onclick="hideClearConfirmation()">Annuler</button>
                    <button class="modal-btn confirm" onclick="confirmClearChat()">Supprimer</button>
                </div>
            </div>
        </div>
    
</div>

    <div id="chatbot-container"></div>
    <script src="chatbot.js"></script>
</body>
</html>
